<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Awards Session</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300&family=Hanken+Grotesk:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="site-header">
  <a class="wordmark" href="/admin">Reaktor</a>
  <a class="label" href="/admin">All sessions</a>
</header>
<main>
  <p id="session-name" class="eyebrow"></p>
  <h1 id="category"></h1>
  <p id="progress" class="muted"></p>
  <p id="load-error" class="error"></p>

  <div id="winner" class="winner" hidden>
    <p id="winner-label" class="eyebrow"></p>
    <div id="winner-names" class="display"></div>
    <p id="winner-note" class="note"></p>
  </div>

  <div id="actions" class="actions">
    <button id="reveal">Show next nominee</button>
    <button id="start">Start voting</button>
    <button id="stop">Stop voting</button>
    <button id="show-winner">Show winner on big display</button>
    <button id="next" class="secondary">Next category</button>
  </div>
  <p id="action-error" class="error"></p>

  <section class="section" style="margin-top: 24px">
    <p class="eyebrow">What attendees see now</p>
    <p style="margin: 0 0 4px"><span id="stage" class="stage"></span></p>
    <p id="stage-text" class="muted" style="margin: 0"></p>
  </section>

  <section id="nominee-section" class="section">
    <h2>Nominees</h2>
    <ul id="nominees" class="plain"></ul>
    <form id="add-form" class="row" style="margin-top: 8px">
      <input id="nominee-name" class="grow" placeholder="Add a nominee" aria-label="Nominee name">
      <input id="nominee-picture" class="grow" type="url" placeholder="Picture URL (optional)" aria-label="Nominee picture URL">
      <button class="secondary">Add</button>
    </form>
  </section>

  <section class="section">
    <h2>Screens</h2>
    <div class="row">
      <a id="display-link" class="button" target="_blank" rel="noopener">Open big display</a>
      <a id="qr-link" class="button secondary" target="_blank" rel="noopener">Open QR page</a>
    </div>
    <p class="muted" style="margin-bottom: 0">Attendees join at <a id="url"></a></p>
  </section>

  <section id="winners-section" class="section" hidden>
    <h2>Winners</h2>
    <ul id="winners" class="plain"></ul>
  </section>
</main>
<script src="/session.js"></script>
</body>
</html>
